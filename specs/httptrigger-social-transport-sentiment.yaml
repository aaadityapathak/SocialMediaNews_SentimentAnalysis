apiVersion: fission.io/v1
kind: Function
metadata:
  name: social-transport-sentiment
spec:
  InvokeStrategy:
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 1
      MinScale: 1
      SpecializationTimeout: 120
      TargetCPUPercent: 0
    StrategyType: execution
  concurrency: 3
  environment:
    name: python313
    namespace: ""
  functionTimeout: 30
  idletimeout: 600
  package:
    functionName: sentiment_matrix_api.get_transport_sentiment
    packageref:
      name: api-pkg
      namespace: ""
  requestsPerPod: 3
  resources: {}
  secrets:
  - name: elastic-api-credentials
    namespace: ""

---
apiVersion: fission.io/v1
kind: HTTPTrigger
metadata:
  name: social-transport-sentiment
spec:
  functionref:
    functionweights: null
    name: social-transport-sentiment
    type: name
  host: ""
  ingressconfig:
    annotations: null
    host: ""
    path: ""
    tls: ""
  keepPrefix: false
  method: GET
  prefix: /social/transport-sentiment
  relativeurl: /social/transport-sentiment
