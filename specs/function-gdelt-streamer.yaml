apiVersion: fission.io/v1
kind: Function
metadata:
  name: gdelt-streamer
spec:
  InvokeStrategy:
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 0
      MinScale: 0
      SpecializationTimeout: 120
      TargetCPUPercent: 0
    StrategyType: execution
  concurrency: 1
  environment:
    name: python313
    namespace: ""
  functionTimeout: 60
  idletimeout: 120
  package:
    functionName: gdelt_fission.harvest_latest_gdelt
    packageref:
      name: harvesters-pkg
      namespace: ""
  requestsPerPod: 2
  resources: {}
  secrets:
  - name: elastic-api-credentials
    namespace: ""
