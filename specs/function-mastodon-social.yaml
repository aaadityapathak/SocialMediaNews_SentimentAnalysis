apiVersion: fission.io/v1
kind: Function
metadata:
  name: mastodon-social
spec:
  InvokeStrategy:
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 0
      MinScale: 0
      SpecializationTimeout: 120
      TargetCPUPercent: 0
    StrategyType: execution
  concurrency: 1
  environment:
    name: python313
    namespace: ""
  functionTimeout: 60
  idletimeout: 120
  package:
    functionName: mastodon_fission.mastodon_social
    packageref:
      name: harvesters-pkg
      namespace: ""
  requestsPerPod: 2
  resources: {}
  secrets:
  - name: mastodon-social
    namespace: ""
  - name: valkey-cfg
    namespace: ""