apiVersion: fission.io/v1
kind: Function
metadata:
  name: bluesky-stream
spec:
  InvokeStrategy:
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 0
      MinScale: 0
      SpecializationTimeout: 120
      TargetCPUPercent: 0
    StrategyType: execution
  concurrency: 1
  environment:
    name: python313
    namespace: ""
  functionTimeout: 35
  idletimeout: 120
  package:
    functionName: bluesky_fission.bluesky_stream
    packageref:
      name: harvesters-pkg
      namespace: ""
  requestsPerPod: 3
  resources: {}
  secrets:
  - name: valkey-cfg
    namespace: ""
  - name: bluesky-main
    namespace: ""