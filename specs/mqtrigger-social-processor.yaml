apiVersion: fission.io/v1
kind: MessageQueueTrigger
metadata:
  name: social-processor
spec:
  contentType: application/json
  cooldownPeriod: 300
  errorTopic: process-errors
  functionref:
    functionweights: null
    name: processor
    type: name
  maxReplicaCount: 72
  maxRetries: 1
  messageQueueType: redis
  metadata:
    address: valkey.valkey.svc.cluster.local:6379
    listName: social-posts-index
  minReplicaCount: 0
  mqtkind: keda
  pollingInterval: 1
  topic: social-posts-index
