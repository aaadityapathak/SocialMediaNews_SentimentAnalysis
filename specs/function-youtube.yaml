apiVersion: fission.io/v1
kind: Function
metadata:
  name: youtube-harvest
spec:
  InvokeStrategy:
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 0
      MinScale: 0
      SpecializationTimeout: 120
      TargetCPUPercent: 0
    StrategyType: execution
  concurrency: 1
  environment:
    name: python313
    namespace: ""
  functionTimeout: 600
  idletimeout: 120
  package:
    functionName: youtube_fission.youtube_harvest
    packageref:
      name: harvesters-pkg
      namespace: ""
  requestsPerPod: 2
  resources: {}
  secrets:
  - name: valkey-cfg
    namespace: ""
  - name: youtube-api-credentials
    namespace: ""