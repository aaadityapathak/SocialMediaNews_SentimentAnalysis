apiVersion: fission.io/v1
kind: Function
metadata:
  name: gdelt-timeseries
spec:
  InvokeStrategy:
    StrategyType: execution
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 1
      MinScale: 1
      SpecializationTimeout: 120
      TargetCPUPercent: 80
  concurrency: 500
  environment:
    name: python313
  functionTimeout: 60
  idletimeout: 120
  package:
    packageref:
      name: api-pkg
    functionName: "gdelt_timeseries_api.get_gdelt_timeseries"
  requestsPerPod: 1
  secrets:
    - name: elastic-api-credentials