apiVersion: fission.io/v1
kind: Function
metadata:
  name: census-api
spec:
  InvokeStrategy:
    ExecutionStrategy:
      ExecutorType: poolmgr
      MaxScale: 0
      MinScale: 0
      SpecializationTimeout: 120
      TargetCPUPercent: 0
    StrategyType: execution
  concurrency: 3
  environment:
    name: python313
    namespace: ""
  functionTimeout: 30
  idletimeout: 120
  package:
    functionName: census_api.get_census_travel
    packageref:
      name: api-pkg
      namespace: ""
  requestsPerPod: 3
  resources: {}
  secrets:
  - name: elastic-api-credentials
    namespace: ""

---
apiVersion: fission.io/v1
kind: HTTPTrigger
metadata:
  name: census-travel
spec:
  functionref:
    functionweights: null
    name: census-api
    type: name
  host: ""
  ingressconfig:
    annotations: null
    host: ""
    path: ""
    tls: ""
  keepPrefix: false
  method: GET
  prefix: /census/travel
  relativeurl: /census/travel
