[project]
name = "api"
version = "0.1.0"
description = "REST API Fission functions for COMP90024 Team 23"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "elasticsearch>=9.3.0",
    "flask>=3.1.3,<4",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "shapely>=2.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
