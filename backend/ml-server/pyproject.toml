[project]
name = "ml-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.1",
    "onnxslim>=0.1.92",
    "optimum[onnxruntime]>=2.1.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sentence-transformers>=5.4.1",
    "uvicorn>=0.46.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "accelerate>=1.13.0",
    "torch>=2.11.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "src"
]
testpaths = [
    "tests"
]
