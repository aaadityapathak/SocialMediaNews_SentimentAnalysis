[project]
name = "harvesters"
version = "0.2.0"
description = "Source adapters and batch importers for social media, news, and elections"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "elasticsearch[async]>=9.3.0",
    "google-api-python-client>=2.194.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "mastodon-py>=2.2.1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-dotenv>=1.2.2",
    "websockets>=15.0",
    "fire>=0.7.0",
    "requests>=2.33.1",
    "pandas>=3.0.2",
    "valkey>=6.1.1,<7",
    "flask>=3.1.3,<4",
]

[project.optional-dependencies]
threads = ["playwright>=1.49", "playwright-stealth>=2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [
    "src", "scripts"
]
testpaths = [
    "tests"
]
