[project]
name = "processing"
version = "0.2.0"
description = "Queue consumers, record normalization, enrichment, and census ingestion"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "elasticsearch[async]>=9.3.0",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "requests>=2.33.1",
    "valkey>=6.1.1,<7",
    "flask>=3.1.3,<4",
    "shapely>=2.0.0",
    "fire>=0.7.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
census = ["geopandas>=1.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
